name: CI

# A42: this repo previously had no CI at all — `tsc`, the vitest tenancy suite
# (server/*.test.ts) and the build ran only on developers' machines, so type,
# tenancy and build regressions could reach `main` unseen. This runs the same
# gate as `npm run ci:gate` (check -> test -> build), as separate steps so a
# failure points at the stage that broke.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

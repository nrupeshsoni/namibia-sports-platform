<script>
 $(document).ready(function() {
    // Check cookies on page load
    if (getCookie("login-username")) {
        $('#login-username').val(getCookie("login-username"));
    }
    if (getCookie("login-password")) {
        $('#login-password').val(getCookie("login-password"));
    }

    $('#js-login').on('submit', function(e) {
        e.preventDefault();

        let username = $('#login-username').val().trim();
        let password = $('#login-password').val().trim();
        let valid = true;

        toastr.clear();

        if (username === '') {
            toastr.error('Username is required.');
            valid = false;
        }

        if (password === '') {
            toastr.error('Password is required.');
            valid = false;
        }

        if (valid) {
            $('#loader').show();
            let rememberMe = $('#login-remember-me').is(':checked');

            let formData = $(this).serialize() + '&btnlogin=true';
            console.log(formData);

            $.ajax({
                type: 'POST',
                url: 'auth/axs',
                data: formData,
                success: function(response) {
                    console.log(response);
                    try {
                        var result = JSON.parse(response);
                        if (result.status === 'success') {
                            if (rememberMe) {
                                document.cookie = "login-username=" + username + "; path=/; max-age=" + 3600;
                                document.cookie = "login-password=" + password + "; path=/; max-age=" + 3600;
                            }
                            toastr.success('Success! Redirecting...');
                            setTimeout(function() {
                                window.location.href = result.redirect;
                            }, 2000);
                        } else {
                            toastr.error(result.message);
                        }
                    } catch (e) {
                        toastr.error('An error occurred while processing the response.');
                    }
                },
                error: function() {
                    toastr.error('An error occurred. Please try again.');
                },
                complete: function() {
                    $('#loader').hide();
                }
            });
        }
    });

    $('#togglePwd').on('click', function() {
        let input = $('#login-password');
        if (input.attr('type') === 'password') {
            input.attr('type', 'text');
            $(this).removeClass('fa-eye').addClass('fa-eye-slash');
        } else {
            input.attr('type', 'password');
            $(this).removeClass('fa-eye-slash').addClass('fa-eye');
        }
    });

    // Function to get cookie value
    function getCookie(name) {
        let value = "; " + document.cookie;
        let parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
    }
});

</script>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
    }

    var flags = document.getElementsByClassName('lang-select'); 

    Array.prototype.forEach.call(flags, function(e) {
        e.addEventListener('click', function() {
            var lang = e.getAttribute('data-lang'); 
            var flag = e.getAttribute('data-flag');
            var languageSelect = document.querySelector("select.goog-te-combo");
            languageSelect.value = lang;
            languageSelect.dispatchEvent(new Event("change"));
            
            // Immediately hide Google Translate loader
            hideTranslateLoader();

            // Update the top flag
            document.getElementById('top-flag').className = 'flag-icon flag-icon-' + flag; 

            // Save the selected language to cookies
            document.cookie = "googtrans=" + lang + "; path=/";
        }); 
    });

    function hideTranslateLoader() {
        var loaderElements = document.querySelectorAll('.skiptranslate, .goog-te-banner-frame');
        loaderElements.forEach(function(el) {
            el.style.display = 'none'; // Hide the elements
        });
    }
</script>

            var act_lang = language.split('/');
            flag = act_lang[act_lang.length - 1].length !== 2 ? 'gb' : 
                   act_lang[act_lang.length - 1] === 'en' ? 'gb' : 
                   act_lang[act_lang.length - 1] === 'sw' ? 'tz' : 
                   act_lang[act_lang.length - 1] === 'ar' ? 'sa' : 
                   act_lang[act_lang.length - 1];
        }

        // Update top flag with the remembered or default language
        $("#top-flag").attr('class', 'flag-icon flag-icon-' + flag);
        
        // Hide Google Translate loader on page load
        hideTranslateLoader();
    });
    
    $(".dropdown-menu li a").click(function() {
        $('#loader-cont').show();
        var selectedFlag = $(this).find('.flag-icon').attr('class'); // Get the selected flag class
        $('#top-flag').attr('class', selectedFlag); // Update top flag
        $("#dropdownMenu1 span").replaceWith($(this).find('.flag-icon'));
        $(this).prepend($("#dropdownMenu1").html());
        
        // Hide Google Translate loader immediately
        hideTranslateLoader();
        $('#loader-cont').hide(); // Hide loader after selecting a language
    });
</script>

<!--PASSWORD VALIDATION-->
<script>
$('#pwdSv').hide();
$('#password, #confirm_password').on('keyup', function () {
if($('#password').val()==""){
  $('#msg').html('Fill passwords').css('color', 'red'); 
  } else if ($('#password').val() == $('#confirm_password').val())   {
    $('#message').html('Passwords match').css('color', 'green');
    $('#pwdSv').show();
    $('#msg').hide();
  } else {
    $('#message').html('Passwords do not match').css('color', 'red');
    $('#pwdSv').hide();
  }
    
});
</script>
